[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "codira", email = "oparachristian9907@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi",
    "google-auth>=2.61.0",
    "httpx>=0.28.1",
    "motor>=3.7.1",
    "prometheus-client>=0.26.0",
    "pyjwt>=2.15.1",
    "pymongo>=4.18.2",
    "python-dotenv",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "uvicorn",
]

[project.scripts]
backend = "app.main:app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
